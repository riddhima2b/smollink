name: Test EC2 SSH Connection

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-ssh:
    runs-on: ubuntu-latest

    steps:
      - name: Verify EC2 SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          install -m 600 /dev/null /tmp/ec2-key.pem

          ssh -i /tmp/ec2-key.pem \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" true \
            >/dev/null 2>&1
            echo "SSH connection successful."
          rm -f /tmp/ec2-key.pem
